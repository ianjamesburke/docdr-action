name: DocDr - Autonomous Documentation
description: Keeps your repository Markdown docs in sync with code changes.

inputs:
  license-key:
    description: Your DocDr license key (store as a GitHub secret)
    required: true
  api-url:
    description: DocDr API URL (override for self-hosted)
    required: false
    default: https://docdr.dev

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install DocDr action
      shell: bash
      run: uv pip install --system "${{ github.action_path }}"

    - name: Run DocDr
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DOCDR_LICENSE_KEY: ${{ inputs.license-key }}
        DOCDR_API_URL: ${{ inputs.api-url }}
      run: python "${{ github.action_path }}/action.py"
