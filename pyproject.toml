[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docdr-action"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.7",
]

[tool.setuptools]
packages = ["docdr"]
py-modules = ["action"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.389",
    "ruff>=0.8.0",
    "responses>=0.25.0",
    "respx>=0.21.0",
]

[project.scripts]
docdr = "action:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
